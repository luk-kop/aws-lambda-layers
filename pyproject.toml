# Root-level pyproject.toml for development dependencies and tool configuration
# Note: Individual layers have their own pyproject.toml for runtime dependencies

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lambda-layers"
version = "0.1.0"
description = "AWS Lambda Layers management system"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

# Explicitly specify no packages - this is a project management repo, not a Python package
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: Property-based tests (run with hypothesis)",
    "integration: Integration tests requiring external services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hypothesis]
max_examples = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
