[project]
name = "valid-layer"
version = "1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
]

[tool.lambda_layer]
python_versions = ["3.11", "3.12"]
architectures = ["x86_64", "arm64"]
platforms = { x86_64 = "manylinux2014_x86_64", arm64 = "manylinux2014_aarch64" }
