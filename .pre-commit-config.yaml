repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        exclude: ^tests/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [ --severity=warning ]
        files: ^scripts/.*\.sh$
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--create-file-if-not-exist=true
      - id: terraform_tflint
      - id: terraform_trivy
        args:
          - --args=--severity HIGH,CRITICAL
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Validate pyproject.toml and lockfiles
        entry: bash -c 'for dir in $(find layers -name "pyproject.toml" -exec dirname {} \;); do uv lock --check --directory "$dir" || exit 1; done'
        language: system
        pass_filenames: false
        files: ^layers/.*/(pyproject\.toml|uv\.lock)$
      - id: validate-layer-config
        name: Validate layer configuration
        entry: bash -c 'for dir in $(find layers -name "pyproject.toml" -exec dirname {} \;); do python3 scripts/layer_config.py validate "$dir" || exit 1; done'
        language: system
        pass_filenames: false
        files: ^layers/.*/pyproject\.toml$
