stages:
  - validate
  - build
  - deploy

validate:pyproject-lockfile:
  stage: validate
  image: ghcr.io/astral-sh/uv:latest
  script:
    - |
      echo "📋 Validating pyproject.toml and lockfiles..."
      errors=""

      for dir in $(find layers -name "pyproject.toml" -exec dirname {} \;); do
        echo "  Checking $dir..."
        if ! uv lock --check --directory "$dir" 2>&1; then
          errors+="  - $dir: pyproject.toml or uv.lock invalid\n"
        fi
      done

      if [[ -n "$errors" ]]; then
        echo "❌ Validation failed:"
        echo -e "$errors"
        exit 1
      fi

      echo "✅ All pyproject.toml and lockfiles are valid"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

validate:layer-config:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep
  script:
    - |
      echo "🔍 Validating pyproject.toml consistency..."
      errors=""

      for pyproject in $(find layers -name "pyproject.toml" 2>/dev/null); do
        dir=$(dirname "$pyproject")

        # Extract from path: layers/name/vX_Y/pyXYZ/arch
        path_name=$(echo "$dir" | cut -d'/' -f2)
        version_dir=$(echo "$dir" | cut -d'/' -f3)  # e.g., "v1_0"
        python_dir=$(echo "$dir" | cut -d'/' -f4)   # e.g., "py312"

        # Validate path format
        if ! echo "$version_dir" | grep -qE '^v[0-9]+_[0-9]+$'; then
          errors+="  - $dir: invalid version directory format (expected vX_Y)\n"
          continue
        fi
        if ! echo "$python_dir" | grep -qE '^py[0-9]{2,3}$'; then
          errors+="  - $dir: invalid python directory format (expected pyXYZ)\n"
          continue
        fi

        # Transform path values to PEP 440 format for comparison
        # "v1_0" -> "1.0"
        path_version=$(echo "$version_dir" | sed 's/^v//' | sed 's/_/./')
        # "py312" -> "3.12" (insert dot after first digit)
        python_digits=$(echo "$python_dir" | sed 's/^py//')
        path_python="${python_digits:0:1}.${python_digits:1}"

        # Extract from pyproject.toml
        file_name=$(grep -oP '^name\s*=\s*"\K[^"]+' "$pyproject" || echo "")
        file_version=$(grep -oP '^version\s*=\s*"\K[^"]+' "$pyproject" || echo "")
        file_python=$(grep -oP 'requires-python\s*=\s*"[>=<]*\K[0-9]+\.[0-9]+' "$pyproject" || echo "")

        layer_errors=""
        [[ -n "$file_name" && "$file_name" != "$path_name" ]] && layer_errors+="name='$file_name' (expected '$path_name'), "
        [[ -n "$file_version" && "$file_version" != "$path_version" ]] && layer_errors+="version='$file_version' (expected '$path_version'), "
        [[ -n "$file_python" && "$file_python" != "$path_python" ]] && layer_errors+="requires-python='$file_python' (expected '$path_python'), "

        if [[ -n "$layer_errors" ]]; then
          errors+="  - $pyproject: ${layer_errors%, }\n"
        fi
      done

      if [[ -n "$errors" ]]; then
        echo "❌ pyproject.toml mismatch with path:"
        echo -e "$errors"
        exit 1
      fi

      echo "✅ All layer configs valid"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

validate:layer-immutability:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash
  script:
    - |
      echo "🔒 Checking layer immutability..."

      # Ensure we have the main branch reference
      git fetch origin main:refs/remotes/origin/main 2>/dev/null || {
        echo "⏭️  Could not fetch origin/main - skipping immutability check for initial branch"
        exit 0
      }

      # Get modified files in layers/ compared to main branch
      modified=$(git diff --name-only origin/main...HEAD -- layers/ 2>/dev/null || echo "")

      if [ -z "$modified" ]; then
        echo "ℹ️  No layer changes detected"
        exit 0
      fi

      errors=""
      deprecated_added=""

      for file in $modified; do
        # Allow adding DEPRECATED file to existing layers
        if [[ "$file" == */DEPRECATED ]]; then
          layer_path=$(echo "$file" | grep -oE 'layers/[^/]+/v[^/]+/py[^/]+/[^/]+' || echo "")
          deprecated_added+="  - $layer_path\n"
          continue
        fi

        # Extract layer path: layers/name/vX_Y/pyXYZ/arch
        layer_path=$(echo "$file" | grep -oE 'layers/[^/]+/v[^/]+/py[^/]+/[^/]+' || echo "")
        [ -z "$layer_path" ] && continue

        # Check if this layer existed in main branch
        if git ls-tree origin/main --name-only -r "$layer_path" 2>/dev/null | grep -q .; then
          errors+="  - $layer_path is immutable. Create new version instead.\n"
        fi
      done

      if [ -n "$deprecated_added" ]; then
        echo "⚠️  Layers marked as deprecated:"
        echo -e "$deprecated_added"
      fi

      if [ -n "$errors" ]; then
        echo "❌ Layer immutability violated:"
        echo -e "$errors"
        exit 1
      fi

      echo "✅ Layer immutability validated"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
