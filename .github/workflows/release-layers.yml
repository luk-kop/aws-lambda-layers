name: Release Layers

# Trigger on push to main branch with changes to layers/**
# Excludes tag pushes to prevent duplicate runs
on:
  push:
    branches:
      - main
    paths:
      - 'layers/**'

jobs:
  # Detect changed layers and output matrix for downstream jobs
  detect:
    name: Detect Changed Layers
    runs-on: ubuntu-latest
    # Skip if this is a tag push (extra safety check)
    if: github.ref_type != 'tag'
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
      matrix: ${{ steps.detect.outputs.matrix }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: detect
        run: |
          # Run detect-changes.sh to find changed layers in push to main
          RESULT=$(./scripts/detect-changes.sh push)
          echo "Detection result: $RESULT"

          # Extract values from JSON output
          LAYERS=$(echo "$RESULT" | jq -c '.layers')
          HAS_CHANGES=$(echo "$RESULT" | jq -r '.has_changes')

          # Simple matrix for jobs that need layer name and version
          VALIDATE_MATRIX=$(echo "$RESULT" | jq -c '{include: [.matrix[] | {layer: .name, version: .version}]}')

          # Build matrix for build job (layer, version, python, arch)
          BUILD_MATRIX=$(echo "$RESULT" | jq -c '.build_matrix')

          # Set outputs
          echo "layers=$LAYERS" >> $GITHUB_OUTPUT
          echo "matrix=$VALIDATE_MATRIX" >> $GITHUB_OUTPUT
          echo "build_matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          # Log summary
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "::notice::Changed layers detected: $LAYERS"
          else
            echo "::notice::No layer changes detected"
          fi

  # Build all variants for each changed layer
  build:
    name: Build ${{ matrix.layer }} py${{ matrix.python }}-${{ matrix.arch }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install build dependencies
        run: pip install packaging

      - name: Build layer variant
        id: build
        run: |
          echo "Building ${{ matrix.layer }} (Python ${{ matrix.python }}, ${{ matrix.arch }})..."
          ./scripts/build-layer.sh "${{ matrix.layer }}" "${{ matrix.python }}" "${{ matrix.arch }}"

          # Calculate python_short (remove dots from version)
          PYTHON_SHORT="${{ matrix.python }}"
          PYTHON_SHORT="${PYTHON_SHORT//./}"
          echo "python_short=$PYTHON_SHORT" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.layer }}-${{ matrix.version }}-py${{ steps.build.outputs.python_short }}-${{ matrix.arch }}
          path: .build/${{ matrix.layer }}/dist/py${{ steps.build.outputs.python_short }}-${{ matrix.arch }}.zip
          retention-days: 1
          if-no-files-found: error

  # Upload artifacts to S3 layers/ prefix
  publish:
    name: Publish to S3
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish artifacts to S3
        id: publish
        env:
          BUILD_MATRIX: ${{ needs.detect.outputs.build_matrix }}
        run: |
          echo "Publishing layer artifacts to S3..."
          echo ""

          # Track published layers for release job
          PUBLISHED_LAYERS=""

          # Parse build matrix and upload each artifact
          echo "$BUILD_MATRIX" | jq -c '.include[]' | while read -r entry; do
            LAYER=$(echo "$entry" | jq -r '.layer')
            VERSION=$(echo "$entry" | jq -r '.version')
            PYTHON=$(echo "$entry" | jq -r '.python')
            ARCH=$(echo "$entry" | jq -r '.arch')

            # Calculate python_short (remove dots from version)
            PYTHON_SHORT="${PYTHON//./}"

            # Artifact name matches the upload pattern from build job
            ARTIFACT_NAME="${LAYER}-${VERSION}-py${PYTHON_SHORT}-${ARCH}"
            ARTIFACT_FILE="py${PYTHON_SHORT}-${ARCH}.zip"

            echo "Processing: $ARTIFACT_NAME"

            # Create build directory structure expected by upload-layer.sh
            BUILD_DIR=".build/${LAYER}/dist"
            mkdir -p "$BUILD_DIR"

            # Move artifact to expected location
            if [ -f "artifacts/${ARTIFACT_NAME}/${ARTIFACT_FILE}" ]; then
              cp "artifacts/${ARTIFACT_NAME}/${ARTIFACT_FILE}" "$BUILD_DIR/"

              # Upload to layers/ prefix (immutability enforced by upload-layer.sh)
              ./scripts/upload-layer.sh "$LAYER" "$VERSION" "${{ vars.LAMBDA_LAYERS_BUCKET }}" "layers"

              # Clean up for next iteration
              rm -rf ".build/${LAYER}"
            else
              echo "::error::Artifact not found: artifacts/${ARTIFACT_NAME}/${ARTIFACT_FILE}"
              exit 1
            fi

            echo ""
          done

          echo "✓ Layer artifacts published to s3://${{ vars.LAMBDA_LAYERS_BUCKET }}/layers/"

  # Create GitHub releases for published layers
  release:
    name: Create GitHub Release
    needs: [detect, publish]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          LAYER_NAME="${{ matrix.layer }}"
          VERSION="${{ matrix.version }}"
          LAYER_DIR="layers/$LAYER_NAME"

          # Get commits since last release tag for this layer
          PREV_TAG=$(git tag -l "layer/$LAYER_NAME/*" --sort=-v:refname | head -1)

          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD -- "$LAYER_DIR/" 2>/dev/null || echo "")
          else
            echo "No previous tag found"
            NOTES="Initial release"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="No changes in layer directory since last release"
          fi

          # Get dependencies from pyproject.toml
          DEPS=$(python3 << EOF
          import tomllib
          with open('$LAYER_DIR/pyproject.toml', 'rb') as f:
              cfg = tomllib.load(f)
          deps = cfg['project'].get('dependencies', [])
          if deps:
              for dep in deps:
                  print(f'- {dep}')
          else:
              print('No dependencies')
          EOF
          )

          # Get build variants from pyproject.toml
          VARIANTS=$(python3 << EOF
          import tomllib
          with open('$LAYER_DIR/pyproject.toml', 'rb') as f:
              cfg = tomllib.load(f)
          layer = cfg['tool']['lambda_layer']
          for py in layer['python_versions']:
              for arch in layer['architectures']:
                  print(f'- Python {py}, {arch}')
          EOF
          )

          # Use heredoc for multiline output
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "deps<<DEPS_EOF"
            echo "$DEPS"
            echo "DEPS_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "variants<<VARIANTS_EOF"
            echo "$VARIANTS"
            echo "VARIANTS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "layer/${{ matrix.layer }}/${{ matrix.version }}"
          name: "Layer ${{ matrix.layer }} v${{ matrix.version }}"
          body: |
            ## Lambda Layer Release

            **Layer:** ${{ matrix.layer }}
            **Version:** ${{ matrix.version }}

            ### Dependencies

            ${{ steps.notes.outputs.deps }}

            ### Build Variants

            ${{ steps.notes.outputs.variants }}

            ### Changes

            ${{ steps.notes.outputs.notes }}

            ### Usage (Terraform)

            ```hcl
            layers = [
              { name = "${{ matrix.layer }}", version = "${{ matrix.version }}", python = "312", arch = "x86_64" }
            ]
            ```

            ### S3 Artifacts

            Artifacts are available at:
            ```
            s3://${{ vars.LAMBDA_LAYERS_BUCKET }}/layers/${{ matrix.layer }}/${{ matrix.version }}/
            ```
          generate_release_notes: false
