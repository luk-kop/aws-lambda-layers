name: Validate Layers

on:
  pull_request:
    paths:
      - 'layers/**'

jobs:
  detect:
    name: Detect Changed Layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
      matrix: ${{ steps.detect.outputs.matrix }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install packaging

      - name: Detect changed layers
        id: detect
        run: |
          # Get changed files and filter to layers/ only
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^layers/' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files in layers/:"
            echo "$CHANGED_FILES"
          fi

          # Build matrix from changed layer paths
          RESULT=$(echo "$CHANGED_FILES" | python scripts/layer_config.py)
          echo "Detection result: $RESULT"

          # Extract values from JSON output
          LAYERS=$(echo "$RESULT" | jq -c '.layers')
          HAS_CHANGES=$(echo "$RESULT" | jq -r '.has_changes')

          # Simple matrix for validate job (layer name and version)
          # Wrap in {include: [...]} for GitHub Actions
          VALIDATE_MATRIX=$(echo "$RESULT" | jq -c '{include: [.matrix[] | {layer: .name, version: .version}]}')

          # Build matrix for build job (layer, version, python, arch)
          # Wrap in {include: [...]} for GitHub Actions
          BUILD_MATRIX=$(echo "$RESULT" | jq -c '{include: .build_matrix}')

          # Set outputs
          echo "layers=$LAYERS" >> $GITHUB_OUTPUT
          echo "matrix=$VALIDATE_MATRIX" >> $GITHUB_OUTPUT
          echo "build_matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          if [ "$HAS_CHANGES" = "true" ]; then
            echo "::notice::Changed layers detected: $LAYERS"
          else
            echo "::notice::No layer changes detected"
          fi

  validate:
    name: Validate ${{ matrix.layer }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Check lockfile is up to date
        working-directory: layers/${{ matrix.layer }}
        run: |
          echo "Checking lockfile for ${{ matrix.layer }}..."
          if ! uv lock --check; then
            echo "::error::Lockfile out of date. Run 'cd layers/${{ matrix.layer }} && uv lock'"
            exit 1
          fi
          echo "✓ Lockfile is up to date"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check S3 version does not exist
        run: |
          echo "Checking if version ${{ matrix.version }} exists for layer '${{ matrix.layer }}'..."
          pip install packaging boto3 > /dev/null 2>&1

          if python scripts/layer_s3.py version-exists "${{ matrix.layer }}" "${{ matrix.version }}" "${{ vars.LAMBDA_LAYERS_BUCKET }}"; then
            echo "::error::Version ${{ matrix.version }} already exists. Bump version in pyproject.toml."
            exit 1
          fi
          echo "✓ Version ${{ matrix.version }} is available"

  build:
    name: Build ${{ matrix.layer }} py${{ matrix.python }}-${{ matrix.arch }}
    needs: [detect, validate]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: pip install packaging boto3

      - name: Build layer variant
        id: build
        run: |
          echo "Building ${{ matrix.layer }} (Python ${{ matrix.python }}, ${{ matrix.arch }})..."
          ./scripts/build-layer.sh "${{ matrix.layer }}" "${{ matrix.python }}" "${{ matrix.arch }}"

          PYTHON_SHORT="${{ matrix.python }}"
          PYTHON_SHORT="${PYTHON_SHORT//./}"
          echo "python_short=$PYTHON_SHORT" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.layer }}-${{ matrix.version }}-py${{ steps.build.outputs.python_short }}-${{ matrix.arch }}
          path: .build/${{ matrix.layer }}/dist/py${{ steps.build.outputs.python_short }}-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error

  upload-test:
    name: Upload Test Artifacts
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: test-upload
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.zip" || echo "No artifacts found"

      - name: Upload test artifacts to S3
        env:
          BUILD_MATRIX: ${{ needs.detect.outputs.build_matrix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install boto3 > /dev/null 2>&1
          echo "Uploading test artifacts to s3://${{ vars.LAMBDA_LAYERS_BUCKET }}/test/${PR_NUMBER}/"

          echo "$BUILD_MATRIX" | jq -c '.include[]' | while read -r entry; do
            LAYER=$(echo "$entry" | jq -r '.layer')
            VERSION=$(echo "$entry" | jq -r '.version')
            PYTHON=$(echo "$entry" | jq -r '.python')
            ARCH=$(echo "$entry" | jq -r '.arch')

            PYTHON_SHORT="${PYTHON//./}"
            ARTIFACT_NAME="${LAYER}-${VERSION}-py${PYTHON_SHORT}-${ARCH}"
            ARTIFACT_FILE="py${PYTHON_SHORT}-${ARCH}.zip"

            echo "Processing: $ARTIFACT_NAME ($ARTIFACT_FILE)"

            BUILD_DIR=".build/${LAYER}/dist"
            mkdir -p "$BUILD_DIR"

            # Try both possible locations (v7 behavior varies)
            if [ -f "artifacts/${ARTIFACT_NAME}/${ARTIFACT_FILE}" ]; then
              cp "artifacts/${ARTIFACT_NAME}/${ARTIFACT_FILE}" "$BUILD_DIR/"
            elif [ -f "artifacts/${ARTIFACT_FILE}" ]; then
              cp "artifacts/${ARTIFACT_FILE}" "$BUILD_DIR/"
            else
              echo "::error::Artifact not found: ${ARTIFACT_NAME}/${ARTIFACT_FILE}"
              echo "Available files:"
              find artifacts -type f -name "*.zip"
              exit 1
            fi

            python ./scripts/layer_s3.py upload "$LAYER" "$VERSION" "${{ vars.LAMBDA_LAYERS_BUCKET }}" --prefix "test/${PR_NUMBER}"
            rm -rf ".build/${LAYER}"
          done

          echo "✓ Test artifacts uploaded to s3://${{ vars.LAMBDA_LAYERS_BUCKET }}/test/${PR_NUMBER}/"
